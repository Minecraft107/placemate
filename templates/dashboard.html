<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - PLACEMATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">Student Dashboard</h2>

    <div class="card p-4 shadow">
        <h4>Placement Prediction</h4>

        <form id="predict-form">
            <input type="number" id="cgpa" class="form-control mb-2" placeholder="CGPA" required>
            <input type="number" id="backlogs" class="form-control mb-2" placeholder="Backlogs" required>
            <input type="number" id="projects" class="form-control mb-2" placeholder="Projects Count" required>
            <input type="number" id="skills_count" class="form-control mb-2" placeholder="Skills Count" required>
            <input type="number" id="ats_score" class="form-control mb-2" placeholder="ATS Score" required>
            <input type="number" id="comm_score" class="form-control mb-2" placeholder="Communication Score" required>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="internship">
                <label class="form-check-label">Internship Done</label>
            </div>

            <button class="btn btn-primary">Predict Placement</button>
        </form>

        <div id="prediction-outcome" class="mt-4"></div>
    </div>
</div>

<script src="/static/js/dashboard.js"></script>

</body>
</html>
